[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-platform-video-downloader"
version = "1.0.0"
description = "CLI and PySide6 browser GUI for downloading authorized media"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp>=2026.7.4",
    "typer==0.26.7",
    "rich==14.2.0",
    "pydantic==2.13.4",
    "PyYAML==6.0.3",
    "imageio-ffmpeg==0.6.0",
    "PySide6==6.11.1",
]

[project.scripts]
video-downloader = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=app --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "app/gui/*",
    "app/cli.py",
    "app/browser/interceptor.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.pylint.main]
py-version = "3.12"
jobs = 0
ignore-paths = ["tests"]
extension-pkg-allow-list = ["PySide6"]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.design]
max-args = 8
max-positional-arguments = 8
max-attributes = 12
max-statements = 60

[tool.pylint."messages control"]
disable = [
    "duplicate-code",
    "fixme",
    "too-few-public-methods",
    "too-many-instance-attributes",
]
